; PocketTrackpad 硬件桥固件构建配置
; 目标：ESP32-C3（也可用 ESP32-S3 / 普通 ESP32，把 board 改掉即可）
; 烧录：pio run -t upload
; 查看日志：pio device monitor

[platformio]
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; 注意：不要加 -DARDUINO_USB_CDC_ON_BOOT=1。当前 espressif32 框架的
    ; chip-debug-report.cpp 在该 flag 下编译报「USBSerial was not declared」
    ; （框架自身 bug）。去掉后 Serial 走 UART0（TX=GPIO21 / RX=GPIO20），
    ; 功能不受影响；需要 USB 串口日志时可在框架修复后自行加回。
    -D CORE_DEBUG_LEVEL=3
upload_speed = 921600
; NimBLE-Arduino 1.4.x：ESP32-C3 可用的轻量 BLE 协议栈。
; 锁定 1.4.3，避免 2.x 的 API 变动（NimBLEHIDDevice 等类在 2.x 有破坏性改动）。
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
