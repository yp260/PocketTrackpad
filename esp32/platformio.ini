; PocketTrackpad 硬件桥固件构建配置
; 目标：ESP32-S3-DevKitC-1（原厂 ESP32-S3-WROOM-1 模组，512KB SRAM，双 USB 口）
; 烧录：pio run -t upload
; 查看日志：pio device monitor

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; 必须锁 6.13.0（arduino-esp32 2.0.17 / ESP-IDF 4.4.7）：NimBLE-Arduino 1.4.3
; 只兼容 arduino-esp32 2.x。不锁版本时 CI 会拉 8.x（arduino 3.3 / IDF 5.5），
; NimBLE init 时空指针崩溃（Guru Meditation LoadProhibited, EXCVADDR 0x5004c），
; 表现为 AP 起来后立刻重启、热点扫不到。切勿改成 7.x/8.x。
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    ; Serial 走 UART0（S3 为 TX=GPIO43 / RX=GPIO44），板子底部左边 USB-UART 口看日志。
    ; ARDUINO_USB_CDC_ON_BOOT 必须保持 0（默认）：一旦设 1，Serial 会被改成 USB CDC，
    ; 左边 UART 口就没日志了。USB 口留给 HID。
    -D CORE_DEBUG_LEVEL=3
    ; ---- 开启 ESP32-S3 原生 USB HID（Windows 有线键鼠）----
    ; 【2026-11-19 修复】ARDUINO_USB_MODE 必须是 0，不是 1！
    ;   arduino-esp32 2.0.17 的 boards.txt 定义：
    ;     usb_mode=0 -> USB-OTG (TinyUSB)          ← USB HID 必须走这个
    ;     usb_mode=1 -> Hardware CDC and JTAG      ← 会把 USB 口占成 "USB JTAG/serial debug unit"
    ;   之前误写成 1，导致 Windows 只看到 JTAG 调试串口、认不到 HID 键鼠。
    ; CONFIG_TINYUSB_ENABLED / HID_ENABLED -> 让 USBHIDKeyboard/USBHIDMouse 类真正编译进来
    ; 实测 espressif32@6.13.0 需要这三个开关，缺一个则 #if CONFIG_TINYUSB_HID_ENABLED 为空、USB HID 失效
    -D ARDUINO_USB_MODE=0
    -D CONFIG_TINYUSB_ENABLED=1
    -D CONFIG_TINYUSB_HID_ENABLED=1
upload_speed = 921600
; NimBLE-Arduino 1.4.x 支持 ESP32-S3（1.4.0 起加入）。锁定 1.4.3 避免 2.x 的
; API 变动（NimBLEHIDDevice 等类在 2.x 有破坏性改动），与既有 HID 代码配套。
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
