name: PocketTrackpad
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_BITCODE: NO
targets:
  PocketTrackpad:
    type: application
    platform: iOS
    sources:
      - path: PocketTrackpad
        excludes:
          - "Info.plist"
          - "Resources"
      # 按键音 keyclick.wav（scripts/gen_keyclick.py 生成）必须进 Resources 构建阶段，
      # 否则 Bundle.main 找不到资源，App 静默无声。
      # 注意：XcodeGen 的 target 级 resources: 键并不生效，必须在 sources 里
      # 用 buildPhase: resources 显式声明。
      - path: PocketTrackpad/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketTrackpad
        INFOPLIST_FILE: PocketTrackpad/Info.plist
        PRODUCT_NAME: PocketTrackpad
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SUPPORTS_MACCATALYST: NO
