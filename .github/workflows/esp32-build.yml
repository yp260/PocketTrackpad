name: Build ESP32 firmware

on:
  push:
    branches: [main, esp32-bridge]
    paths:
      - 'esp32/**'
      - '.github/workflows/esp32-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.cache/platformio
          key: platformio-esp32-${{ hashFiles('esp32/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Install esptool
        run: pip install esptool

      - name: Build firmware
        run: pio run -d esp32

      - name: Merge single flash image
        run: |
          python -m esptool --chip esp32s3 merge-bin \
            -o esp32/.pio/build/esp32-s3-devkitc-1/PT-Bridge-ESP32S3-merged.bin \
            0x0 esp32/.pio/build/esp32-s3-devkitc-1/bootloader.bin \
            0x8000 esp32/.pio/build/esp32-s3-devkitc-1/partitions.bin \
            0x10000 esp32/.pio/build/esp32-s3-devkitc-1/firmware.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockettrackpad-esp32-firmware
          path: |
            esp32/.pio/build/esp32-s3-devkitc-1/PT-Bridge-ESP32S3-merged.bin
            esp32/.pio/build/esp32-s3-devkitc-1/firmware.bin
            esp32/.pio/build/esp32-s3-devkitc-1/bootloader.bin
            esp32/.pio/build/esp32-s3-devkitc-1/partitions.bin
